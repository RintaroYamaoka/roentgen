[package]
name = "roentgen"
version = "0.2.0"
edition = "2021"
description = "repo を 1 回で読み解き、コードの知識グラフと図主体の HTML を出す"
license = "MIT"

[[bin]]
name = "roentgen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ignore = "0.4"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"
sqlparser = "0.58"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"
chrono = "0.4"
once_cell = "1"
toml = "0.8"
pathdiff = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
